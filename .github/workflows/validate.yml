name: 데이터 및 앱 검증

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 자바스크립트 구문 검증
        run: |
          node --check app.js
          node --check quiz-ux.js
          node --check app-update.js
          node --check sw.js
          for f in core/*.js content/*.js scripts/*.mjs; do node --check "$f"; done
      - name: 학습 데이터 검증
        run: node scripts/validate-data.mjs
      - name: 정답 노출 회귀 검증
        run: node scripts/validate-answer-safety.mjs
      - name: 적응형 학습 엔진 테스트
        run: node scripts/test-core.mjs
      - name: 문제풀이 UX 회귀 검증
        run: node scripts/validate-quiz-ux.mjs